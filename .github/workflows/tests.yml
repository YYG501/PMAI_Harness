name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-all:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Show env
        # Node is required by project hooks, including non-Web consumers.
        run: |
          bash --version | head -1
          python3 --version
          git --version

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check runtime capabilities
        run: |
          python3 scripts/environment-check.py check --profile host

      - name: Configure test Git identity
        run: |
          git config --global user.name "PMAI CI"
          git config --global user.email "pmai-ci@example.invalid"

      - name: Run all test suites
        run: bash tests/run-all.sh

  atomic-file-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # macOS job covers the recommended user runtime; run-all covers the
          # minimum supported Python 3.10 on Ubuntu.
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configure test Git identity
        run: |
          git config --global user.name "PMAI CI"
          git config --global user.email "pmai-ci@example.invalid"

      - name: Run atomic file and caller regression suites
        run: |
          bash tests/test-atomic-file.sh
          bash tests/test-lark-adapter.sh
          bash tests/test-init-project-codex-compat.sh
          bash tests/test-environment-check.sh
          bash tests/test-private-onboarding.sh

  windows-local-runtime:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare verified Windows compatibility runtime
        shell: pwsh
        run: |
          $downloadDir = Join-Path $env:RUNNER_TEMP 'pmai-bootstrap'
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
          Invoke-WebRequest https://cygwin.com/setup-x86_64.exe -OutFile (Join-Path $downloadDir 'setup-x86_64.exe')
          Invoke-WebRequest https://cygwin.com/sha512.sum -OutFile (Join-Path $downloadDir 'sha512.sum')
          ./scripts/windows/setup.ps1 -Installer (Join-Path $downloadDir 'setup-x86_64.exe') -ChecksumFile (Join-Path $downloadDir 'sha512.sum') -RuntimeRoot (Join-Path $env:RUNNER_TEMP 'pmai-cygwin')
      - name: Run Windows deterministic regression
        shell: pwsh
        run: |
          ./tests/run-windows.ps1 -RuntimeRoot (Join-Path $env:RUNNER_TEMP 'pmai-cygwin') *> windows-tests.log
          $suiteExitCode = $LASTEXITCODE
          Get-Content windows-tests.log -Tail 50
          exit $suiteExitCode
      - name: Retain Windows regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-regression-${{ github.sha }}
          path: windows-tests.log

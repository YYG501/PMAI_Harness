name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-all:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Show env
        run: |
          bash --version | head -1
          python3 --version
          git --version

      - name: Run all test suites
        run: bash tests/run-all.sh
